<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendWise - Budget Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <aside class="sidebar">
        <h1>SpendWise</h1>

        <nav>
            <a href="#">Dashboard</a>
            <a href="#">Expenses</a>
            <a href="#">Budget</a>
        </nav>
    </aside>

    <main class="main-content">

        <header>
            <h2>Budget Dashboard</h2>
            <p>Track your spending and stay within your budget.</p>
        </header>

        <section class="summary">

            <div class="summary-box">
                <h3>Budget</h3>
                <p id="budget">KSh 0</p>
            </div>

            <div class="summary-box">
                <h3>Total Expenses</h3>
                <p id="total-expenses">KSh 0</p>
            </div>

            <div class="summary-box">
                <h3>Remaining Balance</h3>
                <p id="balance">KSh 0</p>
            </div>

        </section>

        <section class="status-section">
            <h3>Budget Status</h3>
            <p id="status">Enter your budget to begin.</p>
        </section>

        <section class="expense-form-section">

            <h3>Add an Expense</h3>

            <form id="expense-form">

                <label for="expense-name">Expense Name</label>
                <input
                    type="text"
                    id="expense-name"
                    placeholder="e.g. Lunch"
                    required
                >

                <label for="expense-category">Category</label>
                <select id="expense-category" required>
                    <option value="">Select category</option>
                    <option value="Food">Food</option>
                    <option value="Transport">Transport</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Rent">Rent</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Other">Other</option>
                </select>

                <label for="expense-amount">Amount (KSh)</label>
                <input
                    type="number"
                    id="expense-amount"
                    placeholder="e.g. 500"
                    min="1"
                    required
                >

                <button type="submit">Add Expense</button>

            </form>

        </section>

        <section class="expenses-section">

            <h3>Expense Records</h3>

            <div id="expense-list">
                <p>No expenses added yet.</p>
            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
